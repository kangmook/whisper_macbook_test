<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성묵 회의록 대시보드</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div id="processing-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>처리 중입니다</h2>
        <p id="overlay-message">페이지를 벗어나지 마세요. 전사를 진행하고 있습니다.</p>
      </div>
    </div>

    <header class="top-bar">
      <div class="brand">
        <h1>🎙️ 성묵 회의록 스튜디오</h1>
        <p>솔직히 Risk Review나 Risk Preview 아니면 이런거 안만들었다!!</p>
      </div>
      <button id="new-meeting-btn" class="primary">✨ 새 회의 시작</button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>🗂️ 기존 회의록</h2>
        <ul id="meeting-list"></ul>
      </aside>

      <section class="content">
        <div class="meeting-header">
          <h2 id="meeting-title">👀 회의를 선택해 주세요</h2>
          <span id="meeting-status" class="status-chip">-</span>
        </div>

        <div class="title-editor">
          <input
            id="meeting-title-input"
            type="text"
            placeholder="예: 5월 주간 운영 회의"
            maxlength="120"
            disabled
          />
          <button id="save-title-btn" disabled>💾 제목 저장</button>
          <button id="delete-meeting-btn" class="danger" disabled>🗑️ 회의 삭제</button>
        </div>

        <div class="controls">
          <button id="record-start-btn" disabled>🎤 녹음 시작</button>
          <button id="record-stop-btn" disabled>⏹️ 녹음 종료</button>
          <button id="summarize-btn" disabled>🤖 AI 정리</button>
          <button id="download-md-btn" disabled>📥 MD 다운로드</button>
          <span id="recording-timer" class="recording-timer">⏺️ REC 00:00</span>
        </div>

        <div class="results-grid">
          <section class="result-block">
            <h3>📝 전사 결과</h3>
            <pre id="transcript-output" class="panel transcript-panel"></pre>
          </section>

          <section class="result-block">
            <h3>✨ 요약 결과</h3>
            <div id="summary-output" class="panel markdown-panel"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
